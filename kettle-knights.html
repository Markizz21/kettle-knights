    else line = t;

  if (line) ctx.fillText(line, x, y);
  return y;
}

let choices = [], chSel = 0, choiceStart = 0, cardA = '', cardB = '';

// ------------------------------------------------------------- sprites
function drawChar(c, cx, footY, s, mood, speaking) {
  const bob = speaking ? Math.sin(frame * 0.28) * 2 : 0;
  const skin = hex(c.skin), hair = hex(c.hair), shirt = hex(c.shirt), pants = hex(c.pants), acc = hex(c.accent);
  const dark = rgb(30, 24, 28), white = '#fff';

  rect(18, 92, 10, 24, pants); rect(32, 92, 10, 24, pants);

    case 2: circ(14, 20, 9, hair); circ(26, 11, 9, hair); circ(38, 11, 9, hair); circ(48, 20, 9, hair); rect(12, 16, 36, 8, hair); break;

  }

    if (c.acc === 1) rect(4, 46, 16, 2, acc);
  }
  if (c.acc === 2) {

    circ(22, 38, 8, fr); circ(38, 38, 8, fr); circ(22, 38, 6, skin); circ(38, 38, 6, skin); rect(29, 37, 2, 2, fr);
  }

  else if (mood === 4) { circ(22, 38, 5, white); circ(38, 38, 5, white); circ(22, 38, 2, dark); circ(38, 38, 2, dark); }
  else { circ(22, 38, 2.6, dark); circ(38, 38, 2.6, dark); }
  if (mood === 2) { tri(15, 28, 28, 32, 28, 35, hair); tri(45, 28, 32, 32, 32, 35, hair); }
  else if (mood === 3) { tri(15, 33, 28, 29, 28, 32, hair); tri(45, 33, 32, 29, 32, 32, hair); }
  else if (mood === 0 || mood === 1) { rect(16, 29, 11, 2, hair); rect(33, 29, 11, 2, hair); }
  if (c.acc === 3) { circ(30, 44, 4.5, acc); circ(28.5, 44, 1, rgb(160, 80, 100)); circ(31.5, 44, 1, rgb(160, 80, 100)); }
  switch (mood) {
    case 1: tri(23, 47, 37, 47, 30, 55, dark); break;
    case 2: rect(25, 49, 10, 3, dark); break;
    case 3: rect(26, 50, 8, 2, dark); rect(24, 52, 3, 2, dark); rect(33, 52, 3, 2, dark); break;
    case 4: circ(30, 51, 4, dark); break;
    default: rect(25, 49, 10, 2, dark);
  }
  ctx.restore();
}

function drawBG(n) {
  if (n === 'classroom') {
    rect(0, 0, 400, 240, rgb(205, 208, 190)); rect(0, 176, 400, 64, rgb(150, 118, 88));
    rect(70, 28, 200, 92, rgb(70, 50, 30)); rect(76, 34, 188, 80, rgb(40, 84, 62));
    rect(90, 52, 90, 2, rgb(215, 215, 215)); rect(90, 66, 130, 2, rgb(215, 215, 215)); rect(90, 80, 60, 2, rgb(215, 215, 215));
    rect(300, 30, 70, 100, rgb(140, 190, 230)); rect(333, 30, 4, 100, rgb(235, 235, 235)); rect(300, 78, 70, 4, rgb(235, 235, 235));
    circ(30, 40, 16, rgb(250, 250, 250)); rect(29, 28, 2, 13, rgb(30, 30, 30));
    for (let i = 0; i < 3; i++) {
      rect(20 + i * 130, 150, 100, 12, rgb(120, 90, 60));

  } else if (n === 'hall') {
    rect(0, 0, 400, 240, rgb(196, 200, 212)); rect(0, 190, 400, 50, rgb(130, 124, 118)); rect(0, 40, 400, 8, rgb(160, 164, 176));
    for (let i = 0; i < 8; i++) {
      rect(i * 50 + 2, 50, 46, 130, rgb(86, 110, 150));
      rect(i * 50 + 8, 64, 34, 4, rgb(60, 80, 110)); rect(i * 50 + 8, 72, 34, 4, rgb(60, 80, 110));

    rect(0, 0, 400, 120, rgb(64, 58, 108)); rect(0, 120, 400, 70, rgb(226, 150, 112)); rect(0, 190, 400, 50, rgb(224, 230, 240));
    for (let i = 0; i < 6; i++) {
      const h = 70 + (i * 37) % 50;
      rect(i * 70 - 10, 190 - h, 64, h, rgb(50, 46, 70));
      for (let j = 0; j < 3; j++) rect(i * 70 + 4 + j * 18, 190 - h + 10, 8, 10, rgb(250, 220, 120));
    }
    rect(300, 110, 4, 80, rgb(40, 40, 50)); circ(302, 108, 8, rgb(255, 235, 150));
    for (let k = 0; k < 30; k++) circ((k * 53) % 400, (k * 29 + frame) % 240, 1.5, '#fff');
  } else if (n === 'club') {
    rect(0, 0, 400, 240, rgb(58, 56, 78)); rect(0, 170, 400, 70, rgb(70, 64, 60));
    rect(160, 20, 80, 50, rgb(110, 56, 56)); rect(168, 28, 64, 6, rgb(240, 220, 160));
    rect(20, 140, 360, 14, rgb(110, 80, 55));
    for (let i = 0; i < 5; i++) {
      const x = 40 + i * 58;
      rect(x, 98, 48, 36, rgb(20, 20, 30)); rect(x + 3, 101, 42, 30, rgb(60, 130, 200)); rect(x + 20, 134, 8, 6, rgb(30, 30, 40));
    }
    rect(350, 112, 26, 28, rgb(200, 205, 215)); tri(376, 118, 388, 112, 376, 126, rgb(200, 205, 215));
    rect(342, 116, 6, 18, rgb(80, 80, 90)); circ(363, 104 - Math.floor(frame / 4) % 14, 3, rgba(255, 255, 255, 120));
  } else if (n === 'home') {
    rect(0, 0, 400, 240, rgb(72, 62, 96)); rect(0, 180, 400, 60, rgb(96, 72, 56));
    rect(300, 30, 70, 80, rgb(18, 24, 60)); rect(318, 48, 2, 2, '#fff'); rect(345, 70, 2, 2, '#fff');
    rect(40, 130, 170, 10, rgb(120, 90, 60)); rect(50, 140, 6, 60, rgb(80, 60, 40)); rect(194, 140, 6, 60, rgb(80, 60, 40));
    rect(80, 76, 76, 50, rgb(20, 20, 30)); rect(84, 80, 68, 42, rgb(80, 150, 220)); rect(112, 126, 10, 6, rgb(30, 30, 40));
    circ(40, 118, 7, rgb(255, 225, 120));
  } else if (n === 'arena' || n === 'stage') {
    rect(0, 0, 400, 240, rgb(14, 14, 34));
    tri(60, 0, 20, 200, 140, 200, rgba(120, 140, 255, 40));
    tri(200, 0, 150, 200, 250, 200, rgba(255, 120, 200, 40));
    tri(340, 0, 260, 200, 380, 200, rgba(120, 255, 200, 40));
    rect(110, 20, 180, 62, rgb(20, 24, 50));
    textC('CHEBOKSARY MAJOR', 200, 40, 20, rgb(255, 230, 120), true);
    rect(0, 196, 400, 24, rgb(30, 30, 60));
    if (n === 'stage') for (let i = 0; i < 5; i++) { rect(40 + i * 66, 172, 56, 8, rgb(60, 60, 90)); rect(50 + i * 66, 148, 36, 24, rgb(80, 150, 220)); }
    for (let i = 0; i < 40; i++) circ(i * 10 + 5, 224 + (i * 7) % 10, 9, rgb(8, 8, 18));
  } else if (n === 'bus') {
    rect(0, 0, 400, 240, rgb(30, 34, 60)); rect(0, 190, 400, 50, rgb(50, 52, 60));
    for (let i = 0; i < 3; i++) { rect(30 + i * 120, 40, 100, 80, rgb(18, 22, 50)); circ(60 + i * 120, 60, 1.5, '#fff'); circ(110 + i * 120, 90, 1.5, '#fff'); }
    rect(0, 130, 400, 8, rgb(70, 70, 86));
  } else if (n === 'title') {

    rect(0, 200, 400, 40, rgb(36, 40, 78));

}

// ---------------------------------------------------------- script
function loadStory() {
  L = []; labels = {};
  for (const raw of STORY.split('\n')) {
    const l = raw.trim();
    if (!l || l[0] === '#') continue;
    L.push(l);
    if (l[0] === '@') labels[l.slice(1)] = L.length - 1;
  }
}
function parseMood(m) {
  if (!m) return 0;
  if (m.startsWith('sh')) return 4;
  return { h: 1, a: 2, s: 3 }[m[0]] || 0;
}
function startSay(spk, txt) {
  speaker = spk; said = txt; saidArr = Array.from(txt); typeN = 0; typeAcc = 0; state = 'say';
}
function jumpTo(name) {
  if (!(name in labels)) { startSay(-1, "Ошибка сценария: нет метки '" + name + "'"); pc = L.length; return true; }
  pc = labels[name]; return false;
}
function saveGame(resume) {
  try { localStorage.setItem('kk_save', JSON.stringify({ pc: resume, vars, bg, vis, vmood })); haveSave = true; } catch (e) {}
}
function loadGame() {
  try {
    const s = JSON.parse(localStorage.getItem('kk_save'));
    if (!s || s.pc < 0 || s.pc >= L.length) return false;
    pc = s.pc; vars = s.vars || {}; bg = s.bg || 'black'; vis = s.vis || []; vmood = s.vmood || [];
    return true;
  } catch (e) { return false; }
}
function run() {
  for (;;) {
    if (pc >= L.length) { state = 'end'; return; }
    const ln = L[pc];
    if (ln[0] === '@') { pc++; continue; }
    if (ln[0] === '?') {
      choiceStart = pc; choices = [];
      while (pc < L.length && L[pc][0] === '?' && choices.length < 4) {
        const body = L[pc].slice(1).trim(), i = body.lastIndexOf(' -> ');
        choices.push({ text: i >= 0 ? body.slice(0, i) : body, label: i >= 0 ? body.slice(i + 4).trim() : '' });
        pc++;
      }
      chSel = 0; state = 'choice'; saveGame(choiceStart); return;
    }
    const sp = ln.indexOf(' ');
    const cmd = sp < 0 ? ln : ln.slice(0, sp), arg = sp < 0 ? '' : ln.slice(sp + 1).trim();
    if (cmd === 'bg') { bg = arg; fade = 255; pc++; continue; }
    if (cmd === 'show') {
      const [k, m] = arg.split(/\s+/); const ci = charIndex(k);
      if (ci >= 0 && CH[ci].sprite) {
        let slot = vis.indexOf(ci);
        if (slot < 0 && vis.length < 8) { vis.push(ci); vmood.push(0); slot = vis.length - 1; }
        if (slot >= 0) vmood[slot] = parseMood(m);
      }
      pc++; continue;
    }
    if (cmd === 'hide') { const i = vis.indexOf(charIndex(arg)); if (i >= 0) { vis.splice(i, 1); vmood.splice(i, 1); } pc++; continue; }
    if (cmd === 'clear') { vis = []; vmood = []; pc++; continue; }
    if (cmd === 'jump') { if (jumpTo(arg)) return; continue; }
    if (cmd === 'set' || cmd === 'add') {
      const [v, x] = arg.split(/\s+/); const n = parseInt(x, 10);
      if (!isNaN(n)) vars[v] = cmd === 'set' ? n : getVar(v) + n;
      pc++; continue;
    }
    if (cmd === 'if') {
      const m = arg.match(/^(\S+)\s+(==|!=|>=|<=|>|<)\s+(-?\d+)\s*->\s*(\S+)$/);
      if (m) {
        const a = getVar(m[1]), x = parseInt(m[3], 10);
        const ok = { '==': a === x, '!=': a !== x, '>=': a >= x, '<=': a <= x, '>': a > x, '<': a < x }[m[2]];
        if (ok) { if (jumpTo(m[4])) return; continue; }
      }
      pc++; continue;
    }
    if (cmd === 'card') {
      const i = arg.indexOf('|'); cardA = i < 0 ? arg : arg.slice(0, i); cardB = i < 0 ? '' : arg.slice(i + 1);
      state = 'card'; pc++; saveGame(pc); return;
    }
    if (cmd === 'end') { state = 'end'; return; }
    const m = ln.match(/^([a-z]+)(?:\[(\w+)\])?:\s*(.*)$/);
    if (m && charIndex(m[1]) >= 0) {
      const ci = charIndex(m[1]);
      if (m[2]) { const s = vis.indexOf(ci); if (s >= 0) vmood[s] = parseMood(m[2]); }
      startSay(ci, m[3]); pc++; return;
    }
    startSay(-1, ln); pc++; return;
  }
}
function newGame() { vars = {}; vis = []; vmood = []; pc = 0; bg = 'black'; fade = 255; run(); }
function pick(i) {
  if (i < 0 || i >= choices.length) return;
  if (jumpTo(choices[i].label)) return;
  run();
}
function advance() {
  if (state === 'say') { if (typeN < saidArr.length) typeN = saidArr.length; else run(); }
  else if (state === 'card') run();
  else if (state === 'end') state = 'title';
}
function startFromTitle(w) { if (w === 1) { if (haveSave && loadGame()) { fade = 255; run(); } } else newGame(); }

// ------------------------------------------------------------ render
function drawWorld() {
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, SCENE_H); ctx.clip();
  drawBG(bg);
  const n = vis.length;
  if (n > 0) {
    const s = n <= 3 ? 1.2 : n === 4 ? 1.1 : n === 5 ? 0.95 : 0.85;
    const sp = [0, 0, 110, 120, 95, 76, 64, 64, 64][n];
    for (let i = 0; i < n; i++)
      drawChar(CH[vis[i]], 200 + (i - (n - 1) / 2) * sp, 238, s, vmood[i], state === 'say' && speaker === vis[i]);
  }
  if (fade > 0) rect(0, 0, W, SCENE_H, rgba(0, 0, 0, fade));
  ctx.restore();
}
function btn(x, y, w, h, c) { rect(x, y, w, h, c); }
function render() {
  rect(0, 0, W, H, rgb(22, 24, 38));
  if (state === 'title') {
    ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, SCENE_H); ctx.clip();
    drawBG('title');
    for (let i = 0; i < 6; i++) drawChar(CH[i], 42 + i * 63, 238, 0.85, i % 2 ? 1 : 0, false);
    textC('KETTLE KNIGHTS', 200, 18, 34, rgb(255, 230, 120), true);
    textC('Путь от 9«Д» до Чебоксарского мажора', 200, 66, 14, rgb(220, 225, 255));
    ctx.restore();
    for (let i = 0; i < 2; i++) {
      const dis = i === 1 && !haveSave;
      btn(40, 300 + i * 100, 320, 74, dis ? rgb(40, 42, 56) : (tSel === i ? rgb(90, 100, 170) : rgb(60, 66, 110)));
      textC(i === 0 ? 'Новая игра' : 'Продолжить', 200, 322 + i * 100, 26, dis ? rgb(100, 100, 120) : '#fff', true);
    }
    return;
  }
  if (state === 'card') {
    rect(0, 0, W, H, rgb(8, 8, 16));
    textC(cardA, 200, 300, 36, rgb(255, 230, 120), true);
    if (cardB) textC(cardB, 200, 360, 20, rgb(220, 225, 255));
    textC('нажми, чтобы продолжить', 200, 640, 14, rgb(130, 135, 170));
    return;
  }
  if (state === 'end') {
    rect(0, 0, W, H, rgb(8, 8, 16));
    textC('Спасибо за игру!', 200, 300, 32, rgb(255, 230, 120), true);
    textC('нажми, чтобы вернуться в меню', 200, 640, 14, rgb(130, 135, 170));
    return;
  }
  drawWorld();
  if (state === 'choice') {
    for (let i = 0; i < choices.length; i++) {
      const y = 258 + i * 114;
      btn(12, y, 376, 104, chSel === i ? rgb(95, 105, 180) : rgb(55, 60, 100));
      wrap(choices[i].text, 26, y + 14, 348, 19, 26, '#fff');
    }
    return;
  }
  rect(8, 250, 384, 462, rgb(38, 42, 64));
  if (speaker >= 0) {
    rect(16, 258, 250, 36, hex(CH[speaker].shirt));
    textL(CH[speaker].name, 26, 264, 20, '#fff', true);
  }
  wrap(saidArr.slice(0, typeN).join(''), 24, 312, 352, 21, 28, speaker < 0 ? rgb(205, 210, 235) : '#fff');
  if (typeN >= saidArr.length && Math.floor(frame / 20) % 2 === 0) tri(360, 680, 378, 680, 369, 696, rgb(255, 230, 120));
}

function tick() {
  frame++;
  if (fade > 0) fade = Math.max(0, fade - 8);
  if (state === 'say' && typeN < saidArr.length) typeN = Math.min(saidArr.length, typeN + 2);
}
let last = 0, acc = 0;
function loop(t) {
  const dt = Math.min(100, t - last); last = t; acc += dt;
  while (acc >= 16.667) { tick(); acc -= 16.667; }
  ctx.setTransform(SS, 0, 0, SS, 0, 0); render();
  requestAnimationFrame(loop);
}

// ------------------------------------------------------------- input
function onTap(x, y) {
  if (state === 'title') {
    if (x >= 40 && x < 360 && y >= 300 && y < 374) startFromTitle(0);
    else if (x >= 40 && x < 360 && y >= 400 && y < 474) startFromTitle(1);
  } else if (state === 'choice') {
    for (let i = 0; i < choices.length; i++) { const by = 258 + i * 114; if (x >= 12 && x < 388 && y >= by && y < by + 104) { pick(i); break; } }
  } else advance();
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  const r = cv.getBoundingClientRect();
  onTap((e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H);
});
addEventListener('keydown', e => {
  if (state === 'choice') {
    if (e.key === 'ArrowUp') chSel = (chSel + choices.length - 1) % choices.length;
    else if (e.key === 'ArrowDown') chSel = (chSel + 1) % choices.length;
    else if (e.key === 'Enter' || e.key === ' ') pick(chSel);
  } else if (state === 'title') {
    if (e.key === 'ArrowUp' || e.key === 'ArrowDown') tSel = 1 - tSel;
    else if (e.key === 'Enter' || e.key === ' ') startFromTitle(tSel);
  } else if (e.key === 'Enter' || e.key === ' ') advance();
});

loadStory();
try { haveSave = !!localStorage.getItem('kk_save'); } catch (e) {}
window.__vn = { advance, pick, newGame, render, tick, get state() { return state; }, get choices() { return choices; }, get vars() { return vars; }, L, labels };
requestAnimationFrame(loop);
